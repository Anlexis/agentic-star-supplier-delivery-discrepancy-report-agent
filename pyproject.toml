[project]
name = "ret-c2-158"
version = "0.1.1"
description = "SupplierDeliveryPerformanceReportAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by the run-tests job in the pipeline definition
# (wheel-only since the CI stub package cutover). Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# pyyaml is a real runtime dependency: the adapter loads config/config.yaml
# through the framework's loader, and the boundary suite reads it directly.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The published agenticstar-agentcore wheel ships no py.typed marker, so
# framework.* / shared.* imports resolve to Any — which makes every required
# framework subclass a "subclass of Any" error. All other strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict. Correct at runtime, but the
# untyped wheel makes AgentState resolve to Any, so mypy cannot see the TypedDict
# base and reports every field as an invalid type. Silence only that diagnostic,
# only for the state module — the individual field errors are all one cause.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
